# =============================================================================
# Nature Through the Seasons — Nginx config
# -----------------------------------------------------------------------------
# Serves the static app on an internal-only port. Tailscale Funnel sits in
# front, exposing it publicly at  https://<node>.ts.net/nature/  and STRIPPING
# the /nature prefix before it reaches Nginx (confirmed behaviour — see
# PI-INFRASTRUCTURE.md). So from Nginx's point of view the app lives at "/".
#
# Because the prefix is stripped, requests arrive here as "/", "/styles.css",
# "/app.js" etc. — which is exactly what this server block expects. The browser
# address bar still shows /nature/, and the app's relative URLs + <base href>
# handle that on the client side. No rewrite rules are needed here.
#
# Install:
#   sudo cp deploy/nature.nginx.conf /etc/nginx/sites-available/nature
#   sudo ln -s /etc/nginx/sites-available/nature /etc/nginx/sites-enabled/nature
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 127.0.0.1:8085;
    server_name _;

    # Adjust to wherever you cloned the repo on the Pi:
    root /home/pi/nature;
    index index.html;

    # Static SPA-ish shell: fall back to index.html if a path isn't a file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for the static assets; they're tiny and versioned by git.
    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Don't serve the repo's own dotfiles / docs.
    location ~ /\.(?!well-known) { deny all; }
    location = /README.md { return 404; }
    location /deploy/ { deny all; }
}
